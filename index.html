<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserList</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="mb-5">
        <div class="container mt-5">
            <div class="d-flex justify-content-end ">
                <div class="btn-group">
                    <button class="btn btn-secondary" data-bs-theme-value="dark">Dark</button>
                    <button class="btn btn-light" data-bs-theme-value="light">Light</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container ml-5">
        <h1 class="mb-4">Users</h1>
        <!-- Search box -->
        <div class="row">
            <div class="col-md-4">
                <input type="text" class="form-control form-control-lg" placeholder="Search Users">
            </div>
            <div class="col-md-8 user-menu d-flex justify-content-end align-items-center ">
                <ul class="nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Reputation</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-bg-primary rounded-3 " href="#">New Users</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Editors</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Moderators</a>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <main>
        <div class="container mt-5">
            <div class="row">
                <div class="col-md-4">
                    <div class="card mb-3" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top"
                        data-bs-content="Email: john@gmail.com">
                        <div class="card-body">
                            <div class="d-flex gap-3 ">
                                <div class="user-img ">
                                    <img src="https://randomuser.me/api/portraits/men/75.jpg" alt=""
                                        class="rounded-circle img-fluid">
                                </div>
                                <div class="user-info ">
                                    <h4>John Doe</h4>
                                    <h6>Troy MI</h6>
                                    <span class="badge bg-primary">nature</span>
                                    <span class="badge bg-primary">travel</span>
                                    <span class="badge bg-primary">sport</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="col-md-4">
                    <div class="card mb-3" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top"
                        data-bs-content="Email:
                        lehla@gmail.com">
                        <div class=" card-body">
                            <div class="d-flex gap-3 ">
                                <div class="user-img ">
                                    <img src="https://randomuser.me/api/portraits/women/75.jpg" alt=""
                                        class="rounded-circle img-fluid">
                                </div>
                                <div class="user-info ">
                                    <h4>Lehla Nichols</h4>
                                    <h6>Fort Worth, TX</h6>
                                    <span class="badge bg-primary">Fashion</span>
                                    <span class="badge bg-primary">STEM</span>
                                    <span class="badge bg-primary">Architecture</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>


                <div class="col-md-4">
                    <div class="card mb-3" data-bs-container="body" data-bs-toggle="popover" data-bs-placement="top"
                        data-bs-content="Email:
                        annie@gmail.com">
                        <div class=" card-body">
                            <div class="d-flex gap-3 ">
                                <div class="user-img ">
                                    <img src="https://randomuser.me/api/portraits/women/44.jpg" alt=""
                                        class="rounded-circle img-fluid">
                                </div>
                                <div class="user-info ">
                                    <h4>Annie Rice</h4>
                                    <h6>Troy, MI</h6>
                                    <span class="badge bg-primary">Electronics</span>
                                    <span class="badge bg-primary">Tech</span>
                                    <span class="badge bg-primary">Music</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>








    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/darkmodetoggle.js"></script>
    <script>
        const popoverTriggerList = document.querySelectorAll('[data-bs-toggle="popover"]');
        const popoverList = [...popoverTriggerList].map(
            popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl));
    </script>
</body>

</html>
